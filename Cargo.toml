[package]
authors = ["Robert <45889425+robpl4788@users.noreply.github.com>"]
name = "freely_rc_v2"
edition = "2024"
version = "0.1.0"


[lib]
harness = false

# needed for each integration test
[[test]]
name = "integration"
harness = false

[dependencies]
at32f4xx-pac = { version = "0.4.0", features = ["at32f421", "rt"] }
cortex-m = { version = "0.7", features = ["critical-section-single-core"] }
cortex-m-rt = "0.7"
critical-section = "1.2.0"
defmt = "1.0"
defmt-rtt = "1.0"
embedded-hal = "1.0.0"
panic-probe = { version = "1.0", features = ["print-defmt"] }
semihosting = "0.1.20"
# TODO(4) enter your HAL here
# some-hal = "1.2.3"

[dev-dependencies]
defmt-test = "0.3"

# cargo build/run
[profile.dev]
# default is opt-level = '0', but that makes very
# verbose machine code
opt-level = 's'
# trade compile speed for slightly better optimisations
codegen-units = 1

# cargo build/run --release
[profile.release]
# default is opt-level = '3', but that makes quite
# verbose machine code
opt-level = 's'
# trade compile speed for slightly better optimisations
codegen-units = 1
# Use Link Time Optimisations to further inline things across
# crates
lto = 'fat'
# Leave the debug symbols in (default is no debug info)
debug = 2
